# SSX (com.ea.ssx 0.0.8430, armeabi): the modules the port loads
# (runtime/tools/gen_imports.py). libmercury.so (EA's DLC downloader) and
# libnimble.so (EA's telemetry) are not loaded: libgame.so's imports from
# them are the port's stubs (source/ssx_stubs.c, port_imports[]).
MODULES libgame.so libgnustl_shared.so
# libgcc helpers and wide-character functions whose bionic and newlib ABIs agree
PASSTHROUGH __aeabi_ldivmod __aeabi_ul2f
# bionic data objects
DATA timezone b_timezone
DATA tzname b_tzname
