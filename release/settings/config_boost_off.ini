# SSX for Switch -- settings. (The defaults: the game writes this file itself
# at its first start; this copy only shows them.)
[display]
race_fps = 60
race_sim_hz = auto
menu_fps = 60
resolution = auto
render_resolution = 1080
detail_distance = 100
fps_counter = false
saltynx = true
follow_docking = false
[controls]
swap_a_b = false
board_presses = true
[game]
movies = true
skip_dlc_screen = true
[performance]
boost_cpu_when_loading = false
trim_heaps = true
handheld_gpu = 460
threads_first = off
glthread = false
native_atomics = true
gl_finish = frame
shader_cache = true
menu_full_gc = false
[debug]
gl_selftest = false
boot_log_on_screen = false
log_java_calls = false
fp_runfast = false
cpuinfo = switch
skip_ik = auto
live_log = false
profile = false
math_selftest = false
resize_test = 0
window_crop_top = false
[config]
# Settings file format; leave as it is.
version = 2
